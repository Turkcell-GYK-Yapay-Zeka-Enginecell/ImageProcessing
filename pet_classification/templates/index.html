<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PET CLASSIFIER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Pet Classifier</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="aboutus.html">About Us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container text-center">
  <div class="row justify-content-center">
    <div class="col-md-6 mb-4">
      <h4>Upload Photo</h4>
      <p>Select an image of your pet to classify it</p>
      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" class="form-control mb-3" required>
        <button type="submit" class="btn btn-primary">Classify</button>
      </form>
    </div>
  </div>

  {% if filename %}
  <div class="row justify-content-center">
    <div class="col-md-6 mb-4">
      <h4>Result</h4>
      <img src="{{ url_for('static', filename='uploads/' + filename) }}" class="img-fluid rounded mb-3" alt="Uploaded Image">
      <p><strong>Prediction:</strong> {{ prediction }}</p>
    </div>
  </div>
  {% endif %}
</div>

</body>
</html>
